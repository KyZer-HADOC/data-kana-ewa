name: Build installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish app (self-contained, win-x64)
        run: dotnet publish src/DataKanaEwa/DataKanaEwa.csproj -c Release -r win-x64 --self-contained true -p:DebugType=None -p:DebugSymbols=false -o publish

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build setup.exe
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=1.0.${{ github.run_number }}" "installer\setup.iss"

      - uses: actions/upload-artifact@v4
        with:
          name: DataKanaEwa-Setup
          path: dist/*.exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Data Kadayoo v1.0.${{ github.run_number }}
          files: dist/*.exe
